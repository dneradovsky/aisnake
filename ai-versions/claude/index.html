<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Змейка</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap">
<style>
  /* ===== Цветовые токены (светлая и тёмная темы) ===== */
  :root {
    --page: #e4ebe6;
    --board-a: #cfe0d2;
    --board-b: #c6d9ca;
    --snake: #1f5f4a;
    --head: #14392d;
    --food: #d6402f;
    --text: #16261f;
    --muted: #4d6358;
    --panel: #f2f6f3;
    --veil: rgba(228, 235, 230, .88);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #101a17; --board-a: #17261f; --board-b: #1a2b24;
      --snake: #6fcf97; --head: #b6f2cf; --food: #ff7a59;
      --text: #e3efe8; --muted: #8fa89b; --panel: #1b2a24;
      --veil: rgba(16, 26, 23, .88);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page: #101a17; --board-a: #17261f; --board-b: #1a2b24;
    --snake: #6fcf97; --head: #b6f2cf; --food: #ff7a59;
    --text: #e3efe8; --muted: #8fa89b; --panel: #1b2a24;
    --veil: rgba(16, 26, 23, .88);
    color-scheme: dark;
  }

  /* ===== Базовые стили и защита от скролла/зума ===== */
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  html, body {
    height: 100%; margin: 0;
    background: var(--page); color: var(--text);
    font-family: "Rubik", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ===== Каркас страницы ===== */
  .app {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; padding: 12px 16px; gap: 12px;
  }
  .hud {
    width: 100%; max-width: 400px;
    display: flex; align-items: baseline; justify-content: space-between;
  }
  .hud h1 { margin: 0; font-size: 1.5rem; font-weight: 800; letter-spacing: -.02em; }
  .stats { display: flex; gap: 18px; font-size: .95rem; color: var(--muted); }
  .stats b { color: var(--text); font-weight: 600; font-size: 1.25rem; margin-left: 4px; font-variant-numeric: tabular-nums; }

  /* Область, в которую вписывается поле */
  .stage { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  .board { position: relative; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 2px var(--snake); }
  canvas { display: block; width: 100%; height: 100%; }

  /* ===== Оверлей (старт и Game Over) ===== */
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; text-align: center;
    background: var(--veil); padding: 20px;
  }
  .overlay[hidden] { display: none; }
  .overlay h2 { margin: 0; font-size: 1.9rem; font-weight: 800; letter-spacing: -.02em; }
  .overlay p { margin: 0; color: var(--muted); font-size: 1rem; line-height: 1.4; }
  .overlay button {
    margin-top: 6px; min-height: 48px; padding: 0 28px; border: 0; border-radius: 12px;
    background: var(--snake); color: var(--page); font: inherit; font-weight: 600; font-size: 1.05rem; cursor: pointer;
  }
  .overlay button:focus-visible { outline: 3px solid var(--food); outline-offset: 3px; }
  .hint-touch { display: none; }
  @media (pointer: coarse) { .hint-touch { display: inline; } .hint-keys { display: none; } }

  /* ===== Экранные стрелки (только на сенсорных экранах) ===== */
  .pad {
    display: none; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 64px);
    gap: 8px; padding-bottom: 6px;
  }
  @media (pointer: coarse), (max-width: 700px) { .pad { display: grid; } }
  .pad button {
    width: 64px; height: 64px; border: 0; border-radius: 16px; padding: 0;
    background: var(--panel); color: var(--snake); display: grid; place-items: center; cursor: pointer;
    touch-action: none;
  }
  .pad button:active { background: var(--snake); color: var(--page); }
  .pad svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
  .b-up { grid-column: 2; grid-row: 1; }
  .b-left { grid-column: 1; grid-row: 2; }
  .b-down { grid-column: 2; grid-row: 2; }
  .b-right { grid-column: 3; grid-row: 2; }
  .b-up svg { transform: rotate(0deg); } .b-right svg { transform: rotate(90deg); }
  .b-down svg { transform: rotate(180deg); } .b-left svg { transform: rotate(270deg); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="chev" viewBox="0 0 24 24"><polyline points="5,15 12,8 19,15"/></symbol>
</svg>

<div class="app">
  <div class="hud">
    <h1>Змейка</h1>
    <div class="stats" aria-live="polite">
      <span>Счёт<b id="score">0</b></span>
      <span>Рекорд<b id="best">0</b></span>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="board" id="board">
      <canvas id="canvas" aria-label="Игровое поле"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="ov-title">Змейка</h2>
        <p id="ov-text"></p>
        <button id="ov-btn" type="button">Играть</button>
        <p><span class="hint-keys">Пробел или Enter</span><span class="hint-touch">Коснитесь экрана</span></p>
      </div>
    </div>
  </div>

  <div class="pad" id="pad">
    <button class="b-up" data-dir="up" aria-label="Вверх"><svg><use href="#chev"/></svg></button>
    <button class="b-left" data-dir="left" aria-label="Влево"><svg><use href="#chev"/></svg></button>
    <button class="b-down" data-dir="down" aria-label="Вниз"><svg><use href="#chev"/></svg></button>
    <button class="b-right" data-dir="right" aria-label="Вправо"><svg><use href="#chev"/></svg></button>
  </div>
</div>

<script>
(() => {
  'use strict';

  /* ===== Константы ===== */
  const COLS = 20, ROWS = 20;          // размер сетки в клетках
  const MAX_SIZE = 400, MIN_SIZE = 300; // размер поля в пикселях
  const START_DELAY = 140, MIN_DELAY = 70; // интервал хода, мс
  const DIRS = {
    up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
    left: { x: -1, y: 0 }, right: { x: 1, y: 0 }
  };

  /* ===== Элементы DOM ===== */
  const $ = (id) => document.getElementById(id);
  const stage = $('stage'), board = $('board'), canvas = $('canvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = $('score'), bestEl = $('best');
  const overlay = $('overlay'), ovTitle = $('ov-title'), ovText = $('ov-text'), ovBtn = $('ov-btn');

  /* ===== Состояние игры ===== */
  let snake, dir, queue, food, score, best = 0, status = 'ready', timer = null;
  let cell = 20, colors = {};

  // Рекорд хранится в браузере (если хранилище доступно)
  try { best = parseInt(localStorage.getItem('snake-best'), 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  /* ===== Инициализация новой партии ===== */
  function reset() {
    const cx = Math.floor(COLS / 2), cy = Math.floor(ROWS / 2);
    // Голова первая; змейка в центре, длина 3, смотрит вправо
    snake = [{ x: cx, y: cy }, { x: cx - 1, y: cy }, { x: cx - 2, y: cy }];
    dir = DIRS.right;
    queue = [];
    score = 0;
    scoreEl.textContent = 0;
    placeFood();
  }

  /* Еда появляется в случайной свободной клетке */
  function placeFood() {
    const taken = new Set(snake.map((s) => s.x + ',' + s.y));
    const free = [];
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++)
        if (!taken.has(x + ',' + y)) free.push({ x, y });
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  /* ===== Управление ===== */
  // Добавляем направление в очередь, запрещая разворот на 180° и повтор
  function setDir(name) {
    const d = DIRS[name];
    const last = queue.length ? queue[queue.length - 1] : dir;
    if (d.x === -last.x && d.y === -last.y) return; // разворот запрещён
    if (d.x === last.x && d.y === last.y) return;   // то же направление
    if (queue.length < 2) queue.push(d);
  }

  /* Нажатие направления: в режиме ожидания сначала запускает игру */
  function steer(name) {
    if (status !== 'running') { startGame(); }
    setDir(name);
  }

  function startGame() {
    if (status === 'running') return;
    reset();
    status = 'running';
    overlay.hidden = true;
    draw();
    schedule();
  }

  /* ===== Игровой цикл ===== */
  function schedule() {
    const delay = Math.max(MIN_DELAY, START_DELAY - score * 3); // с ростом счёта быстрее
    timer = setTimeout(tick, delay);
  }

  function tick() {
    if (status !== 'running') return;
    if (queue.length) dir = queue.shift();

    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    const eating = food && head.x === food.x && head.y === food.y;

    // Столкновение со стеной
    const hitWall = head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS;
    // Столкновение с хвостом (если не едим, кончик хвоста освободится)
    const body = eating ? snake : snake.slice(0, -1);
    const hitSelf = body.some((s) => s.x === head.x && s.y === head.y);
    if (hitWall || hitSelf) return gameOver(false);

    snake.unshift(head);
    if (eating) {
      score += 1;                    // +1 очко и рост за каждую еду
      scoreEl.textContent = score;
      placeFood();
      if (!food) { draw(); return gameOver(true); } // поле заполнено
    } else {
      snake.pop();
    }
    draw();
    schedule();
  }

  function gameOver(won) {
    status = 'over';
    clearTimeout(timer);
    if (score > best) {
      best = score; bestEl.textContent = best;
      try { localStorage.setItem('snake-best', String(best)); } catch (e) {}
    }
    ovTitle.textContent = won ? 'Победа!' : 'Игра окончена';
    ovText.textContent = 'Ваш счёт: ' + score;
    ovBtn.textContent = 'Играть снова';
    overlay.hidden = false;
    draw();
  }

  /* ===== Отрисовка ===== */
  function readColors() {
    const s = getComputedStyle(document.documentElement);
    ['board-a', 'board-b', 'snake', 'head', 'food', 'page'].forEach((k) => {
      colors[k] = s.getPropertyValue('--' + k).trim();
    });
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    if (!snake) return;
    // Шахматный фон
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++) {
        ctx.fillStyle = (x + y) % 2 ? colors['board-a'] : colors['board-b'];
        ctx.fillRect(x * cell, y * cell, cell, cell);
      }
    // Еда
    if (food) {
      ctx.fillStyle = colors.food;
      ctx.beginPath();
      ctx.arc((food.x + .5) * cell, (food.y + .5) * cell, cell * .36, 0, Math.PI * 2);
      ctx.fill();
    }
    // Змейка
    const pad = cell * .08;
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? colors.head : colors.snake;
      roundRect(s.x * cell + pad, s.y * cell + pad, cell - pad * 2, cell - pad * 2, cell * .28);
      ctx.fill();
    });
    // Глаза на голове (смещены по направлению движения)
    const h = snake[0], cx = (h.x + .5) * cell, cy = (h.y + .5) * cell;
    const px = -dir.y, py = dir.x; // перпендикуляр к направлению
    ctx.fillStyle = colors.page;
    [-1, 1].forEach((k) => {
      ctx.beginPath();
      ctx.arc(cx + dir.x * cell * .15 + px * k * cell * .2, cy + dir.y * cell * .15 + py * k * cell * .2, cell * .09, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  /* ===== Адаптивный размер поля ===== */
  function resize() {
    const avail = Math.min(MAX_SIZE, stage.clientWidth, stage.clientHeight);
    cell = Math.floor(Math.max(MIN_SIZE, avail) / COLS);
    const size = cell * COLS;
    const dpr = window.devicePixelRatio || 1;
    board.style.width = board.style.height = size + 'px';
    canvas.width = canvas.height = Math.round(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    readColors();
    if (!snake) reset();
    draw();
  }

  /* ===== Клавиатура ===== */
  const KEYS = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right'
  };
  window.addEventListener('keydown', (e) => {
    if (KEYS[e.key]) { e.preventDefault(); steer(KEYS[e.key]); return; }
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      if (status !== 'running') startGame(); // рестарт по Space/Enter
    }
  });

  /* ===== Экранные кнопки ===== */
  document.querySelectorAll('.pad button').forEach((b) => {
    b.addEventListener('pointerdown', (e) => { e.preventDefault(); steer(b.dataset.dir); });
  });

  /* ===== Свайпы и тап ===== */
  const SWIPE_MIN = 24; // минимальная длина свайпа, px
  let t0 = null, swiped = false;

  document.addEventListener('touchstart', (e) => {
    e.preventDefault(); // блокируем скролл и зум страницы
    const t = e.touches[0];
    t0 = { x: t.clientX, y: t.clientY, onPad: !!e.target.closest('.pad') };
    swiped = false;
  }, { passive: false });

  document.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (!t0 || t0.onPad || swiped) return;
    const t = e.touches[0], dx = t.clientX - t0.x, dy = t.clientY - t0.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < SWIPE_MIN) return;
    swiped = true;
    steer(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  }, { passive: false });

  document.addEventListener('touchend', (e) => {
    e.preventDefault();
    // Тап по оверлею запускает игру или рестарт
    if (t0 && !t0.onPad && !swiped && status !== 'running' && e.target.closest('.overlay')) startGame();
    t0 = null;
  }, { passive: false });

  // Запрет жестов масштабирования в iOS Safari
  ['gesturestart', 'gesturechange', 'gestureend'].forEach((n) =>
    document.addEventListener(n, (e) => e.preventDefault()));

  // Клик мышью по кнопке на оверлее
  ovBtn.addEventListener('click', startGame);

  /* ===== Запуск ===== */
  ovText.textContent = 'Съешьте как можно больше, не врезаясь в стены и в себя.';
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', resize);
  resize();
})();
</script>
</body>
</html>
