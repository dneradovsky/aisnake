<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <title>Змейка</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #1e293b;
        --panel-hover: #334155;
        --board: #0b1220;
        --snake: #22c55e;
        --snake-head: #4ade80;
        --food: #f43f5e;
        --text: #f1f5f9;
        --muted: #94a3b8;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }

      body {
        height: 100vh;
        height: 100dvh;
        background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 60%);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(8px, 2vh, 16px);
        padding: 12px;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      header {
        width: clamp(240px, min(92vw, 100dvh - 330px), 400px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      h1 {
        font-size: 22px;
        font-weight: 700;
        line-height: 1.2;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .score {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        line-height: 1.15;
      }

      .score-label {
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .score-value {
        font-size: 26px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        transition: transform 0.15s ease, color 0.15s ease;
      }

      .score-value.bump {
        transform: scale(1.35);
        color: var(--snake-head);
      }

      .score-best {
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .icon-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border: none;
        border-radius: 12px;
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
        transition: background-color 0.15s ease, transform 0.1s ease;
      }

      .icon-btn:hover {
        background: var(--panel-hover);
      }

      .icon-btn:active {
        transform: scale(0.92);
      }

      .icon-btn svg {
        width: 22px;
        height: 22px;
      }

      .board {
        position: relative;
        width: clamp(240px, min(92vw, 100dvh - 330px), 400px);
        aspect-ratio: 1 / 1;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(148, 163, 184, 0.15);
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 16px;
        background: rgba(11, 18, 32, 0.85);
        backdrop-filter: blur(4px);
        text-align: center;
        transition: opacity 0.25s ease, visibility 0.25s ease;
      }

      .overlay.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .overlay-title {
        font-size: clamp(22px, 7vw, 28px);
        font-weight: 700;
      }

      .overlay-text {
        font-size: 15px;
        color: var(--muted);
      }

      .overlay-text strong {
        color: var(--text);
      }

      .overlay-text .record {
        color: #fbbf24;
        font-weight: 700;
      }

      .diff {
        display: flex;
        gap: 6px;
      }

      .diff-btn {
        padding: 10px 14px;
        border: 2px solid var(--panel-hover);
        border-radius: 12px;
        background: var(--panel);
        color: var(--muted);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease;
      }

      .diff-btn.active {
        border-color: var(--snake);
        background: rgba(34, 197, 94, 0.12);
        color: var(--snake-head);
      }

      .btn {
        min-width: 170px;
        min-height: 54px;
        padding: 0 26px;
        border: none;
        border-radius: 14px;
        background: var(--snake);
        color: #052e16;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.12s ease, background-color 0.2s ease;
      }

      .btn:hover {
        background: var(--snake-head);
      }

      .btn:active {
        transform: scale(0.96);
      }

      .btn:focus-visible {
        outline: 3px solid #fde68a;
        outline-offset: 3px;
      }

      .pad {
        display: grid;
        grid-template-columns: repeat(3, 64px);
        grid-template-rows: repeat(2, 64px);
        gap: 8px;
      }

      .pad-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 64px;
        border: none;
        border-radius: 16px;
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
        box-shadow: 0 4px 0 #0f172a, 0 8px 18px rgba(0, 0, 0, 0.35);
        transition: transform 0.08s ease, background-color 0.15s ease, box-shadow 0.08s ease;
      }

      .pad-btn:hover {
        background: var(--panel-hover);
      }

      .pad-btn:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #0f172a, 0 3px 8px rgba(0, 0, 0, 0.3);
        background: var(--snake);
        color: #052e16;
      }

      .pad-btn:focus-visible {
        outline: 3px solid #fde68a;
        outline-offset: 2px;
      }

      .pad-up { grid-column: 2; grid-row: 1; }
      .pad-left { grid-column: 1; grid-row: 2; }
      .pad-down { grid-column: 2; grid-row: 2; }
      .pad-right { grid-column: 3; grid-row: 2; }

      .pad-btn svg { width: 28px; height: 28px; }

      .hint { font-size: 13px; color: var(--muted); text-align: center; }

      /* На компьютере экранные стрелки и подсказка про свайпы не нужны */
      @media (hover: hover) and (pointer: fine) {
        .pad, .hint-touch { display: none; }
      }

      /* На телефоне подсказка про клавиатуру не нужна */
      @media (hover: none), (pointer: coarse) {
        .hint-desktop { display: none; }
      }

      /* На низких экранах уменьшаем кнопки и убираем подсказки, чтобы всё влезло без прокрутки */
      @media (max-height: 700px) {
        .hint { display: none; }
        .pad {
          grid-template-columns: repeat(3, 54px);
          grid-template-rows: repeat(2, 54px);
        }
        .pad-btn { width: 54px; height: 54px; }
        .pad-btn svg { width: 24px; height: 24px; }
        header, .board { width: clamp(240px, min(92vw, 100dvh - 250px), 400px); }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Змейка</h1>
      <div class="header-right">
        <div class="score">
          <span class="score-label">Счёт</span>
          <span class="score-value" id="score">0</span>
          <span class="score-best" id="best">Рекорд: 0</span>
        </div>
        <button class="icon-btn" id="sound-btn" type="button" aria-label="Звук вкл/выкл">
          <svg id="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><path d="M15.54 8.46a5 5 0 0 1 0 7.07" /><path d="M19.07 4.93a10 10 0 0 1 0 14.14" /></svg>
          <svg id="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><line x1="23" y1="9" x2="17" y2="15" /><line x1="17" y1="9" x2="23" y2="15" /></svg>
        </button>
      </div>
    </header>

    <div class="board">
      <canvas id="board"></canvas>

      <div class="overlay" id="overlay">
        <h2 class="overlay-title" id="overlay-title">Змейка</h2>
        <p class="overlay-text" id="overlay-text">Съедайте еду и растите</p>
        <div class="diff" id="diff" role="group" aria-label="Уровень сложности">
          <button class="diff-btn" data-diff="easy" type="button">Лёгкий</button>
          <button class="diff-btn" data-diff="normal" type="button">Средний</button>
          <button class="diff-btn" data-diff="hard" type="button">Сложный</button>
        </div>
        <button class="btn" id="start-btn" type="button">Начать</button>
      </div>
    </div>

    <div class="pad" aria-label="Экранные стрелки">
      <button class="pad-btn pad-up" data-dir="up" type="button" aria-label="Вверх">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6" /></svg>
      </button>
      <button class="pad-btn pad-left" data-dir="left" type="button" aria-label="Влево">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6" /></svg>
      </button>
      <button class="pad-btn pad-down" data-dir="down" type="button" aria-label="Вниз">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg>
      </button>
      <button class="pad-btn pad-right" data-dir="right" type="button" aria-label="Вправо">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6" /></svg>
      </button>
    </div>

    <p class="hint hint-desktop">Стрелки управляют змейкой, Пробел - старт, M - звук</p>
    <p class="hint hint-touch">Свайпы или стрелки, кнопка сверху - звук</p>

    <script>
      (() => {
        'use strict';

        // Размер поля: 20x20 клеток, рисуем в логических координатах 400x400
        const GRID = 20;
        const SIZE = 400;
        const CELL = SIZE / GRID;
        const START_LENGTH = 3;
        const MAX_QUEUED_TURNS = 3;
        const SWIPE_MIN_PX = 24;
        const PARTICLES_PER_FOOD = 14;

        // Уровни сложности: скорость змейки в миллисекундах на клетку
        const DIFFS = {
          easy: { label: 'Лёгкий', ms: 160 },
          normal: { label: 'Средний', ms: 115 },
          hard: { label: 'Сложный', ms: 80 },
        };

        const DIRS = {
          up: { x: 0, y: -1 },
          down: { x: 0, y: 1 },
          left: { x: -1, y: 0 },
          right: { x: 1, y: 0 },
        };

        const KEY_TO_DIR = {
          ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
          KeyW: 'up', KeyS: 'down', KeyA: 'left', KeyD: 'right',
        };

        const canvas = document.getElementById('board');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayText = document.getElementById('overlay-text');
        const startBtn = document.getElementById('start-btn');
        const diffBox = document.getElementById('diff');
        const soundBtn = document.getElementById('sound-btn');
        const iconOn = document.getElementById('icon-on');
        const iconOff = document.getElementById('icon-off');

        // ---------- Сохранение в LocalStorage ----------

        // Читаем ключ с запасным значением; приватный режим может блокировать запись
        function loadJSON(key, fallback) {
          try {
            const raw = localStorage.getItem(key);
            return raw === null ? fallback : JSON.parse(raw);
          } catch (e) { return fallback; }
        }

        function saveJSON(key, value) {
          try { localStorage.setItem(key, JSON.stringify(value)); }
          catch (e) { /* хранилище недоступно - играем без сохранения */ }
        }

        const BEST_KEY = 'snake.best.v1';
        const DIFF_KEY = 'snake.diff.v1';
        const SOUND_KEY = 'snake.sound.v1';

        let best = loadJSON(BEST_KEY, { easy: 0, normal: 0, hard: 0 });
        if (typeof best !== 'object' || best === null) best = { easy: 0, normal: 0, hard: 0 };

        let diffName = loadJSON(DIFF_KEY, 'normal');
        if (!DIFFS[diffName]) diffName = 'normal';

        let soundOn = loadJSON(SOUND_KEY, true);
        if (typeof soundOn !== 'boolean') soundOn = true;

        // ---------- Состояние игры ----------

        let snake = [];   // текущие клетки змейки
        let prevSnake = []; // клетки предыдущего шага (для плавной интерполяции)
        let dir = DIRS.right;
        let turnQueue = [];
        let food = null;
        let score = 0;
        let state = 'idle'; // idle | playing | over
        let stepMs = DIFFS[diffName].ms;
        let acc = 0;       // накопленное время для шагов
        let particles = []; // частицы при поедании
        let eatFlash = 0;   // вспышка на голове при поедании
        let deathFlash = 0; // красная вспышка при проигрыше
        let shake = 0;      // тряска экрана при проигрыше
        let overlayDelay = null;

        // ---------- Звук (Web Audio API) ----------

        let audioCtx = null;

        function getAudioCtx() {
          if (!audioCtx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return null;
            audioCtx = new AC();
          }
          if (audioCtx.state === 'suspended') audioCtx.resume();
          return audioCtx;
        }

        // Короткий тон с плавным изменением частоты и затуханием громкости
        function playTone(freqStart, freqEnd, duration, type, volume) {
          if (!soundOn) return;
          const ac = getAudioCtx();
          if (!ac) return;
          const osc = ac.createOscillator();
          const gain = ac.createGain();
          const t = ac.currentTime;
          osc.type = type;
          osc.frequency.setValueAtTime(freqStart, t);
          osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd, 1), t + duration);
          gain.gain.setValueAtTime(volume, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
          osc.connect(gain);
          gain.connect(ac.destination);
          osc.start(t);
          osc.stop(t + duration + 0.02);
        }

        const playEatSound = () => playTone(520, 880, 0.12, 'square', 0.12);
        const playOverSound = () => {
          playTone(300, 60, 0.5, 'sawtooth', 0.16);
          playTone(150, 40, 0.55, 'triangle', 0.1);
        };

        function updateSoundIcon() {
          iconOn.style.display = soundOn ? '' : 'none';
          iconOff.style.display = soundOn ? 'none' : '';
        }

        function toggleSound() {
          soundOn = !soundOn;
          saveJSON(SOUND_KEY, soundOn);
          updateSoundIcon();
          if (soundOn) playEatSound(); // подтверждение включения коротким сигналом
        }

        // ---------- Логика игры ----------

        const isOccupied = (cell) => snake.some((s) => s.x === cell.x && s.y === cell.y);

        // Случайная свободная клетка для еды
        function spawnFood() {
          const free = [];
          for (let y = 0; y < GRID; y++) {
            for (let x = 0; x < GRID; x++) {
              const cell = { x, y };
              if (!isOccupied(cell)) free.push(cell);
            }
          }
          if (free.length === 0) return null;
          return free[Math.floor(Math.random() * free.length)];
        }

        function resetGame() {
          const c = Math.floor(GRID / 2);
          snake = [];
          for (let i = 0; i < START_LENGTH; i++) snake.push({ x: c - i, y: c });
          prevSnake = snake.map((s) => ({ ...s }));
          dir = DIRS.right;
          turnQueue = [];
          score = 0;
          scoreEl.textContent = '0';
          bestEl.textContent = 'Рекорд: ' + (best[diffName] || 0);
          acc = 0;
          particles = [];
          eatFlash = 0;
          deathFlash = 0;
          shake = 0;
          food = spawnFood();
        }

        // Добавляет поворот в очередь; разворот на 180 градусов отбрасывается
        function queueTurn(name) {
          const next = DIRS[name];
          if (!next) return;
          const last = turnQueue.length ? turnQueue[turnQueue.length - 1] : dir;
          if (next.x === last.x && next.y === last.y) return;
          if (next.x === -last.x && next.y === -last.y) return;
          if (turnQueue.length >= MAX_QUEUED_TURNS) return;
          turnQueue.push(next);
        }

        // Взрыв частиц в точке поедания
        function spawnParticles(cx, cy) {
          for (let i = 0; i < PARTICLES_PER_FOOD; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 60 + Math.random() * 160;
            particles.push({
              x: cx, y: cy,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              life: 0.4 + Math.random() * 0.3,
              maxLife: 0.7,
              size: 2 + Math.random() * 3,
              color: Math.random() < 0.5 ? '#f43f5e' : '#4ade80',
            });
          }
        }

        // Один логический шаг: движение, столкновения, рост
        function step() {
          if (turnQueue.length) dir = turnQueue.shift();
          prevSnake = snake.map((s) => ({ ...s }));

          const head = snake[0];
          const newHead = { x: head.x + dir.x, y: head.y + dir.y };

          const hitWall =
            newHead.x < 0 || newHead.y < 0 || newHead.x >= GRID || newHead.y >= GRID;
          // Хвост уходит из клетки в этом же ходу, поэтому его не учитываем
          const body = snake.slice(0, snake.length - 1);
          const hitSelf = body.some((s) => s.x === newHead.x && s.y === newHead.y);

          if (hitWall || hitSelf) { endGame(); return; }

          snake.unshift(newHead);

          if (food && newHead.x === food.x && newHead.y === food.y) {
            score += 1;
            scoreEl.textContent = String(score);
            scoreEl.classList.remove('bump');
            void scoreEl.offsetWidth;
            scoreEl.classList.add('bump');
            spawnParticles(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2);
            eatFlash = 1;
            playEatSound();
            food = spawnFood();
            if (!food) endGame(); // поле заполнено
          } else {
            snake.pop();
          }
        }

        function endGame() {
          state = 'over';
          deathFlash = 1;
          shake = 0.6;
          playOverSound();

          const prevBest = best[diffName] || 0;
          const isRecord = score > prevBest;
          if (isRecord) {
            best[diffName] = score;
            saveJSON(BEST_KEY, best);
          }
          bestEl.textContent = 'Рекорд: ' + best[diffName];

          clearTimeout(overlayDelay);
          overlayDelay = setTimeout(() => {
            const recordHtml = isRecord ? '<br><span class="record">Новый рекорд!</span>' : '';
            showOverlay('Игра окончена', `Ваш счёт: <strong>${score}</strong>${recordHtml}`, 'Играть снова');
          }, 550);
        }

        // ---------- Отрисовка ----------

        // Полифилл roundRect для старых браузеров
        if (!ctx.roundRect) {
          ctx.roundRect = function (x, y, w, h, r) {
            const rad = Math.min(r, w / 2, h / 2);
            this.moveTo(x + rad, y);
            this.arcTo(x + w, y, x + w, y + h, rad);
            this.arcTo(x + w, y + h, x, y + h, rad);
            this.arcTo(x, y + h, x, y, rad);
            this.arcTo(x, y, x + w, y, rad);
            this.closePath();
          };
        }

        // Canvas рисуется в физических пикселях устройства для резкой картинки
        function resizeCanvas() {
          const rect = canvas.getBoundingClientRect();
          const dpr = window.devicePixelRatio || 1;
          const px = Math.max(1, Math.round(rect.width * dpr));
          if (canvas.width !== px) { canvas.width = px; canvas.height = px; }
        }

        function draw(now) {
          resizeCanvas();
          const scale = canvas.width / SIZE;

          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          ctx.setTransform(scale, 0, 0, scale, 0, 0);
          if (shake > 0) {
            ctx.translate((Math.random() - 0.5) * shake * 14, (Math.random() - 0.5) * shake * 14);
          }

          ctx.fillStyle = '#0b1220';
          ctx.fillRect(-20, -20, SIZE + 40, SIZE + 40);

          ctx.strokeStyle = 'rgba(148, 163, 184, 0.06)';
          ctx.lineWidth = 1;
          for (let i = 1; i < GRID; i++) {
            ctx.beginPath();
            ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, SIZE);
            ctx.moveTo(0, i * CELL); ctx.lineTo(SIZE, i * CELL);
            ctx.stroke();
          }

          if (food) {
            const pulse = 1 + Math.sin(now / 180) * 0.08;
            const cx = food.x * CELL + CELL / 2;
            const cy = food.y * CELL + CELL / 2;
            ctx.save();
            ctx.shadowColor = 'rgba(244, 63, 94, 0.8)';
            ctx.shadowBlur = 12;
            ctx.fillStyle = '#f43f5e';
            ctx.beginPath();
            ctx.arc(cx, cy, (CELL / 2 - 3) * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          for (const p of particles) {
            ctx.globalAlpha = Math.max(p.life / p.maxLife, 0);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;

          const t = state === 'playing' ? Math.min(acc / stepMs, 1) : 1;
          const prevLen = prevSnake.length;
          snake.forEach((segment, index) => {
            const prev = prevSnake[Math.min(index, prevLen - 1)] || segment;
            const x = prev.x + (segment.x - prev.x) * t;
            const y = prev.y + (segment.y - prev.y) * t;
            const isHead = index === 0;
            const grow = isHead ? eatFlash * 0.18 : 0;
            const pad = CELL * (0.04 + grow * 0.2);
            ctx.fillStyle = isHead ? '#4ade80' : '#22c55e';
            ctx.beginPath();
            ctx.roundRect(x * CELL + pad, y * CELL + pad, CELL - pad * 2, CELL - pad * 2, isHead ? 7 : 5);
            ctx.fill();

            if (isHead) {
              const cx = x * CELL + CELL / 2;
              const cy = y * CELL + CELL / 2;
              const fx = dir.x, fy = dir.y, px = -fy, py = fx;
              ctx.fillStyle = '#052e16';
              for (const sign of [-1, 1]) {
                ctx.beginPath();
                ctx.arc(cx + fx * 4 + px * sign * 4, cy + fy * 4 + py * sign * 4, 1.8, 0, Math.PI * 2);
                ctx.fill();
              }
            }
          });

          if (deathFlash > 0) {
            ctx.fillStyle = `rgba(244, 63, 94, ${deathFlash * 0.25})`;
            ctx.fillRect(-20, -20, SIZE + 40, SIZE + 40);
          }

          ctx.setTransform(1, 0, 0, 1, 0, 0);
        }

        // ---------- Игровой цикл ----------

        let lastTime = 0;

        function frame(ts) {
          requestAnimationFrame(frame);
          const dt = Math.min((ts - lastTime) / 1000, 0.1);
          lastTime = ts;

          if (state === 'playing') {
            acc += dt * 1000;
            while (acc >= stepMs) {
              acc -= stepMs;
              step();
              if (state !== 'playing') { acc = 0; break; }
            }
          }

          if (eatFlash > 0) eatFlash = Math.max(eatFlash - dt * 5, 0);
          if (deathFlash > 0) deathFlash = Math.max(deathFlash - dt * 2, 0);
          if (shake > 0) shake = Math.max(shake - dt * 1.2, 0);
          if (particles.length) {
            for (const p of particles) {
              p.x += p.vx * dt; p.y += p.vy * dt;
              p.vx *= 0.92; p.vy *= 0.92; p.life -= dt;
            }
            particles = particles.filter((p) => p.life > 0);
          }

          draw(ts);
        }

        // ---------- Экраны и интерфейс ----------

        function showOverlay(title, text, buttonLabel) {
          overlayTitle.textContent = title;
          overlayText.innerHTML = text;
          startBtn.textContent = buttonLabel;
          overlay.classList.remove('hidden');
        }

        function hideOverlay() { overlay.classList.add('hidden'); }

        function startGame() {
          if (state === 'playing') return;
          clearTimeout(overlayDelay);
          stepMs = DIFFS[diffName].ms;
          resetGame();
          state = 'playing';
          hideOverlay();
          getAudioCtx();
        }

        function updateDiffButtons() {
          diffBox.querySelectorAll('.diff-btn').forEach((b) => {
            b.classList.toggle('active', b.dataset.diff === diffName);
          });
        }

        document.addEventListener('keydown', (e) => {
          const name = KEY_TO_DIR[e.code];
          if (e.code === 'KeyM') { toggleSound(); return; }
          if (e.code === 'Space' || e.code === 'Enter') {
            if (state !== 'playing') { e.preventDefault(); startGame(); }
            return;
          }
          if (name) { e.preventDefault(); if (state === 'playing') queueTurn(name); }
        });

        startBtn.addEventListener('click', startGame);

        diffBox.addEventListener('click', (e) => {
          const btn = e.target.closest('.diff-btn');
          if (!btn || !DIFFS[btn.dataset.diff]) return;
          diffName = btn.dataset.diff;
          stepMs = DIFFS[diffName].ms;
          saveJSON(DIFF_KEY, diffName);
          updateDiffButtons();
          bestEl.textContent = 'Рекорд: ' + (best[diffName] || 0);
        });

        document.querySelectorAll('.pad-btn').forEach((btn) => {
          btn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (state === 'idle') { startGame(); return; }
            if (state === 'playing') queueTurn(btn.dataset.dir);
          });
        });

        soundBtn.addEventListener('click', toggleSound);

        // Свайпы по всей странице; прокрутка и масштабирование отключены
        let touchStart = null;
        document.addEventListener('touchstart', (e) => {
          if (e.touches.length !== 1) return;
          touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }, { passive: true });

        document.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });

        document.addEventListener('touchend', (e) => {
          if (!touchStart || e.changedTouches.length === 0) return;
          const dx = e.changedTouches[0].clientX - touchStart.x;
          const dy = e.changedTouches[0].clientY - touchStart.y;
          touchStart = null;
          if (Math.max(Math.abs(dx), Math.abs(dy)) < SWIPE_MIN_PX) return;
          if (state !== 'playing') return;
          if (Math.abs(dx) > Math.abs(dy)) queueTurn(dx > 0 ? 'right' : 'left');
          else queueTurn(dy > 0 ? 'down' : 'up');
        });

        ['gesturestart', 'gesturechange', 'gestureend'].forEach((type) => {
          document.addEventListener(type, (e) => e.preventDefault());
        });

        updateDiffButtons();
        updateSoundIcon();
        resetGame();
        showOverlay('Змейка', 'Съедайте еду и растите', 'Начать');
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
